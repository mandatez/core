[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mandatez"
version = "0.1.0"
description = "Trust infrastructure for AI agents — Ed25519-signed events, runtime policy, audit trail"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MandateZ", email = "hello@mandatez.com" }]
keywords = [
  "ai-agents",
  "agent-security",
  "langchain",
  "crewai",
  "ed25519",
  "owasp-agentic",
  "ai-governance",
  "mandatez",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.24.0",
  "supabase>=2.0.0",
  "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
crewai = ["crewai>=0.28.0"]
dev = [
  "build>=1.0.0",
  "twine>=4.0.0",
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://mandatez.mintlify.app"
Documentation = "https://mandatez.mintlify.app"
Repository = "https://github.com/mandatez/core"
Issues = "https://github.com/mandatez/core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mandatez*"]

[tool.setuptools.package-data]
mandatez = ["py.typed"]
